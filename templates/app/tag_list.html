{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    Tags
    <a href="{% url 'app:tag-create' %}" class="btn btn-primary" style="float: right; margin-top: 10px;">
      Add
    </a>
  </h1>
  <br>

  {% if tag_list %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>

      {% for tag in tag_list %}
        <tr>
          <td>
            {{ tag.name }}
          </td>
          <td>
       <a href="{% url 'app:task-update' pk=tag.id %}" class="btn btn-secondary link-to-page">
          Update
        </a>
            </td>
            <td>
              <a href="{% url 'app:task-delete' pk=tag.id %}" class="btn btn-danger link-to-page">
          Delete
        </a>
            </td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
      <p>There are no tags</p>
  {% endif %}
{% endblock %}
